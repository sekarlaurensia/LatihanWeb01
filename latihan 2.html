<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Layout Website Sederhana</title>

</head>

<body style="margin: 0; padding: 20px; font-family: Arial, sans-serif; background-color: white;">

    <table style="width: 650px; border-collapse: collapse; border: 1px solid #e9c36c;">

        <tr>

            <td colspan="2"
                style="height: 75px; text-align: center; vertical-align: middle; background-color: #f9e9d6;">

                <header>
                    HEADER
                </header>

            </td>

        </tr>


        <tr>

            <td colspan="2"
                style="height: 50px; text-align: center; vertical-align: middle; background-color: #d5e4fb; border-top: 1px solid #5c9ded; border-bottom: 1px solid #5c9ded;">

                <nav>
                    NAVIGASI
                </nav>

            </td>

        </tr>


        <tr>

            <td
                style="width: 77%; height: 150px; padding: 55px 50px; vertical-align: top; background-color: #fadddd; border-right: 1px solid #65a66e;">

                <main>

                    <h1 style="margin: 0 0 20px; font-size: 30px;">
                        Heading 1
                    </h1>

                    <p style="max-width: 350px; margin: 0; font-size: 15px; line-height: 1.25;">
                        Lorem ipsum dolor sit amet,
                        consectetur adipisicing elit,
                        sed do eiusmod tempor
                        incididunt ut labore et dolore
                        magna aliqua.
                    </p>

                </main>

            </td>


            <td
                style="width: 23%; height: 150px; padding: 75px 10px; vertical-align: top; background-color: #d2ebd0;">

                <aside>

                    <h3 style="margin: 0 0 15px; font-size: 16px;">
                        Menu:
                    </h3>

                    <ul style="margin: 0; padding-left: 28px; font-size: 15px; line-height: 1.3;">

                        <li>Home</li>

                        <li>Berita</li>

                        <li>Layanan</li>

                        <li>Kontak</li>

                    </ul>

                </aside>

            </td>

        </tr>


        <tr>

            <td colspan="2"
                style="height: 50px; text-align: center; vertical-align: middle; background-color: #f9e9d6; border-top: 1px solid #f8c44d;">

                <footer>
                    FOOTER
                </footer>

            </td>

        </tr>

    </table>

</body>

</html>
